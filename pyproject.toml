[project]
name = "kw-mcp"
version = "0.2.3"
description = "Read-only MCP server for Kwangwoon University KLAS"
readme = "README.md"
authors = [
    { name = "kyowon1108", email = "kyowon1108@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "cryptography>=50.0.2",
    "httpx>=0.28.1",
    "keyring>=25.7.0",
    "mcp[cli]>=2.3",
    "tzdata>=2024.1 ; sys_platform == 'win32'",
    "websockets>=15",
]

[project.scripts]
kw-mcp = "kw_mcp:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
    "respx>=0.23.1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
