# Installs this commit on Windows and macOS as an agent update would, and runs the agent's OS-specific code (Run key, pythonw spawn,
# launchd job, per-user lock, self-update with pinned, hash-checked dependencies and its self-test).
# (The terminal installers were retired in 1.1: students install the .mcpb from /start.)
name: Agent install (Windows, macOS)

# Manual runs and release tags only: macOS minutes count 10x on a private repo's free Actions plan.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  install:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0

      - name: Install this commit as an agent update would (pinned and hash-checked like a release)
        shell: powershell
        run: |
          $env:Path = "$env:USERPROFILE\.local\bin;$env:Path"
          uv export --frozen --no-dev --no-emit-project --no-header --format requirements-txt -o exported.txt
          # A wheel first: --no-build forbids building the checkout itself, as it does for agents.
          uv build --wheel --out-dir dist-ci --quiet
          if ($LASTEXITCODE -ne 0) { throw 'building this commit failed' }
          $whl = (Get-ChildItem dist-ci\kw_mcp-*-py3-none-any.whl).FullName
          uv tool install --force --quiet --python 3.13 --no-build --constraints exported.txt $whl
          if ($LASTEXITCODE -ne 0) { throw 'installing this commit failed' }
          # uv tool install ignores the --hash lines: reinstall every dependency with its hash checked.
          $py = Join-Path (uv tool dir) 'kw-mcp\Scripts\python.exe'
          uv pip install --python $py --require-hashes --no-deps --reinstall --no-build --quiet -r exported.txt
          if ($LASTEXITCODE -ne 0) { throw 'the dependencies did not match their pinned hashes' }
          kw-mcp --version
          if ($LASTEXITCODE -ne 0) { throw 'the self-test (kw-mcp --version) failed' }

      - name: Autostart round trip and per-user lock
        shell: powershell
        run: |
          $env:Path = "$env:USERPROFILE\.local\bin;$env:Path"
          $py = Join-Path (uv tool dir) 'kw-mcp\Scripts\python.exe'
          & $py .github/workflows/windows_agent_check.py
          if ($LASTEXITCODE -ne 0) { throw 'Windows agent check failed' }

      - name: Self-update installs a new wheel with its pins after the agent exits
        shell: powershell
        run: |
          $env:Path = "$env:USERPROFILE\.local\bin;$env:Path"
          (Get-Content pyproject.toml) -replace '^version = ".*"', 'version = "0.99.0"' | Set-Content pyproject.toml
          uv build --wheel --out-dir dist-update --quiet
          if ($LASTEXITCODE -ne 0) { throw 'building the test wheel failed' }
          $py = Join-Path (uv tool dir) 'kw-mcp\Scripts\python.exe'
          $whl = (Get-ChildItem dist-update\kw_mcp-0.99.0-py3-none-any.whl).FullName
          & $py .github/workflows/update_check.py $whl exported.txt
          if ($LASTEXITCODE -ne 0) { throw 'install_update refused' }
          # Poll with uv, not the tool's own python: running it would lock the files being replaced.
          for ($i = 0; $i -lt 60; $i++) {
            $v = (uv tool list 2>$null | Select-String '^kw-mcp v(\S+)').Matches.Groups[1].Value
            if ($v -eq '0.99.0') { break }
            Start-Sleep -Seconds 3
          }
          Write-Host "installed version after update: $v"
          $log = "$env:LOCALAPPDATA\kw-campus\update.log"
          if (Test-Path $log) { Get-Content $log }
          if ($v -ne '0.99.0') { throw 'the detached update did not install the new version' }

  macos:
    # A fresh Mac: this commit installed like an update, launchd job, lock, self-update.
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: uv where students have it (~/.local/bin, the agent looks there under launchd's bare PATH)
        run: curl -LsSf https://astral.sh/uv/0.13.1/install.sh | sh

      - name: Install this commit as an agent update would (pinned and hash-checked like a release)
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          uv export --frozen --no-dev --no-emit-project --no-header --format requirements-txt -o exported.txt
          # A wheel first: --no-build forbids building the checkout itself, as it does for agents.
          uv build --wheel --out-dir dist-ci --quiet
          uv tool install --force --quiet --python 3.13 --no-build --constraints exported.txt dist-ci/kw_mcp-*-py3-none-any.whl
          # uv tool install ignores the --hash lines: reinstall every dependency with its hash checked.
          uv pip install --python "$(uv tool dir)/kw-mcp/bin/python" --require-hashes --no-deps --reinstall --no-build \
            --quiet -r exported.txt
          kw-mcp --version

      - name: launchd job, per-user lock, uv found under launchd's bare PATH
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          py="$(uv tool dir)/kw-mcp/bin/python"
          env -i HOME="$HOME" PATH=/usr/bin:/bin:/usr/sbin:/sbin "$py" .github/workflows/macos_agent_check.py

      - name: Self-update installs a newer wheel with its pins and self-tests it
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          sed -i '' 's/^version = ".*"/version = "0.99.0"/' pyproject.toml
          uv build --wheel --out-dir dist-update --quiet
          py="$(uv tool dir)/kw-mcp/bin/python"
          env -i HOME="$HOME" PATH=/usr/bin:/bin:/usr/sbin:/sbin \
            "$py" .github/workflows/update_check.py dist-update/kw_mcp-0.99.0-py3-none-any.whl exported.txt
          uv tool list | grep -E '^kw-mcp v0\.99\.0'
